name: instabox-ci

on:
  push:
  pull_request:

jobs:
  test:
    # instabox ci 模板注册的 GitHub 自托管 runner
    runs-on: instabox-medium
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t novel-tests -f Dockerfile .

      - name: Pytest in container
        run: |
          mkdir -p test-results
          docker run --rm -v "$PWD/test-results:/results" novel-tests

      - name: Upload junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/results.xml
          if-no-files-found: warn
