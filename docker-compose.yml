services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: novel-web:latest
    ports:
      - "8080:8080"
    command: ["python", "scripts/web.py", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: novel-tests:latest
    command: ["python", "-m", "pytest", "tests/", "-v", "--junitxml=/results/results.xml"]
    volumes:
      - ./test-results:/results
